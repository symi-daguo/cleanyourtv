plugins {
    id 'com.android.application'
}

// minSdk is 26 by default, the value upstream ships. -PlauncherMinSdk=23 builds the same source for older
// sets (Android 6.0, e.g. Hisense VIDAA): java.time is API 26, so anything below it needs the desugared
// library. That library is only added when the override asks for it, which keeps the default release APK
// under the 480 KB gate in CI.
def launcherMinSdk = providers.gradleProperty('launcherMinSdk').isPresent()
        ? providers.gradleProperty('launcherMinSdk').get().toInteger()
        : 26
def desugaredJavaTime = launcherMinSdk < 26

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        // -PlauncherMinSdk replaces the 26 above for older sets (Android 6.0, API 23). A separate
        // statement, so tests/test_agents_md.py still reads the default from this file.
        if (launcherMinSdk != 26) {
            minSdk launcherMinSdk
        }
        targetSdk 34
        versionCode 9
        versionName '3.0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    sourceSets {
        main {
            // Only the low-SDK build carries the built-in fallback picture: it is for sets whose external storage
            // is cut away (Hisense VIDAA), and a 1280x720 JPEG in every build would eat into the 576 KB APK gate.
            if (desugaredJavaTime) assets.srcDirs += 'src/min23/assets'
        }
    }

    compileOptions {
        // java.time is API 26. Below it the calls have to go through desugar_jdk_libs, or the launcher
        // crashes with NoClassDefFoundError on java.time.LocalDate at the first frame.
        coreLibraryDesugaringEnabled desugaredJavaTime
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Only in the low-SDK build: see desugaredJavaTime above.
    if (desugaredJavaTime) {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    }
}
